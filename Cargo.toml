[package]
name = "netsecops"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "⚡ A blazing-fast CLI toolkit for network security operations — firewall auditing, proxy log parsing, SSL cert checking, and more."
license = "MIT"
readme = "README.md"
repository = "https://github.com/DBISHT4U/NetSecOPS"
keywords = ["network", "security", "firewall", "proxy", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.4", features = ["derive", "color"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
tabled = "0.15"
indicatif = "0.17"
# reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
rustls = "0.22"
x509-parser = "0.16"
webpki-roots = "0.26"
regex = "1.10"
walkdir = "2.5"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
